<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui,'Microsoft YaHei',sans-serif;width:280px;margin:12px;color:#222}
h3{margin:0 0 8px;font-size:15px} .st{padding:8px;border-radius:8px;background:#f2f4f7;margin:8px 0;line-height:1.5}
.row{display:flex;align-items:center;gap:8px;margin:8px 0} input[type=range]{flex:1} b{min-width:60px;text-align:right}
small{color:#666;line-height:1.5;display:block}
</style></head><body>
<h3>🎞️ SoundMesh 画面延后</h3>
<label class="row"><input type="checkbox" id="en"> 在 YouTube 里自动延后画面</label>
<div class="st" id="st">读取中…</div>
<div class="row"><span>微调</span><input type="range" id="trim" min="-300" max="300" step="10"><b id="tv"></b></div>
<small>画面还比声音早 → 往右拉；画面比声音晚 → 往左拉。<br>需要电脑上开着 SoundMesh 主机并正在共享声音。</small>
<script src="popup.js"></script></body></html>
